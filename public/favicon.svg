<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 80 80">
  <!-- Superstition Labs — The Spire mark. Amber baked in (#FFB347) so
       the favicon renders correctly in any browser context. -->
  <g stroke="#FFB347" fill="#FFB347">
    <!-- Orbital arc (lowered, peak ducks behind chiseled tip) -->
    <path d="M 14 31 A 80 80 0 0 1 66 31" fill="none" stroke-width="1.8"/>
    <!-- Satellite -->
    <circle cx="55" cy="28" r="4"/>
    <!-- Weaver's Needle silhouette (shifted down, near-vertical sides) -->
    <path d="M 44 21 L 30 33 L 24 71 L 50 71 Z" stroke="none"/>
    <!-- Ground line -->
    <line x1="18" x2="56" y1="71" y2="71" stroke-width="1.2"/>
  </g>
</svg>
