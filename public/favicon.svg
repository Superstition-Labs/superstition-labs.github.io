    <path d="M 68 3 L 77 3 L 77 12" fill="none" stroke-width="2"/>
    <path d="M 3 68 L 3 77 L 12 77" fill="none" stroke-width="2"/>
    <path d="M 68 77 L 77 77 L 77 68" fill="none" stroke-width="2"/>
